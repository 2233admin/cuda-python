<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 800" style="background-color:#fff"><defs><marker id="rougharrow" markerHeight="10" markerWidth="12" orient="auto" refX="11" refY="5"><path fill="none" stroke="#333" stroke-linejoin="round" stroke-width="2" d="M1,2 L9,5 L2,8 L1,2"/></marker><marker id="orangearrow" markerHeight="8" markerWidth="12" orient="auto" refX="11" refY="5"><path fill="#FF9800" stroke="#FF9800" stroke-linejoin="round" stroke-width="2" d="M1,2 L9,5 L2,8 L1,2"/></marker></defs><text x="452" y="22" fill="#333" font-family="Comic Sans MS, cursive, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">CUDA Python CI Pipeline Flow</text><path fill="#e8f4fd" stroke="#2196F3" stroke-linejoin="round" stroke-width="2.5" d="M52,42 Q53,40 855,39 Q858,41 857,108 Q855,112 51,110 Q48,107 52,42 Z"/><text x="452" y="62" fill="#1976D2" font-family="Comic Sans MS, cursive, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">TRIGGER EVENTS</text><text x="251" y="82" fill="#333" font-family="Comic Sans MS, cursive, sans-serif" font-size="11" text-anchor="middle">• Push to main branch</text><text x="451" y="82" fill="#333" font-family="Comic Sans MS, cursive, sans-serif" font-size="11" text-anchor="middle">• Pull request</text><text x="651" y="82" fill="#333" font-family="Comic Sans MS, cursive, sans-serif" font-size="11" text-anchor="middle">• Manual workflow dispatch</text><path fill="none" stroke="#333" stroke-linejoin="round" stroke-width="2.5" d="M449,112 Q451,125 452,132 M447,128 L452,134 L457,129"/><path fill="#f3e5f5" stroke="#9C27B0" stroke-linejoin="round" stroke-width="2.5" d="M51,142 Q52,139 853,141 Q856,144 854,287 Q852,292 49,289 Q46,286 51,142 Z"/><text x="451" y="162" fill="#7B1FA2" font-family="Comic Sans MS, cursive, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">BUILD STAGE</text><path fill="#fff" stroke="#9C27B0" stroke-linejoin="round" stroke-width="2" d="M82,182 Q83,179 278,181 Q282,183 281,238 Q279,242 81,241 Q78,238 82,182 Z"/><text x="181" y="202" fill="#333" font-family="Comic Sans MS, cursive, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">linux-64</text><text x="179" y="222" fill="#666" font-family="Comic Sans MS, cursive, sans-serif" font-size="11" text-anchor="middle">Self-hosted</text><path fill="#fff" stroke="#9C27B0" stroke-linejoin="round" stroke-width="2" d="M351,183 Q352,180 548,182 Q552,184 551,239 Q549,243 350,242 Q347,239 351,183 Z"/><text x="451" y="203" fill="#333" font-family="Comic Sans MS, cursive, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">linux-aarch64</text><text x="449" y="223" fill="#666" font-family="Comic Sans MS, cursive, sans-serif" font-size="11" text-anchor="middle">Self-hosted</text><path fill="#fff" stroke="#9C27B0" stroke-linejoin="round" stroke-width="2" d="M621,184 Q622,181 818,183 Q822,185 821,240 Q819,244 620,243 Q617,240 621,184 Z"/><text x="721" y="204" fill="#333" font-family="Comic Sans MS, cursive, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">win-64</text><text x="719" y="224" fill="#666" font-family="Comic Sans MS, cursive, sans-serif" font-size="11" text-anchor="middle">GitHub-hosted</text><text x="102" y="262" fill="#333" font-family="Comic Sans MS, cursive, sans-serif" font-size="11" text-anchor="start">• Python versions: 3.9, 3.10, 3.11, 3.12, 3.13</text><text x="101" y="277" fill="#333" font-family="Comic Sans MS, cursive, sans-serif" font-size="11" text-anchor="start">• CUDA version: 13.0.0 (build-time)</text><text x="502" y="262" fill="#333" font-family="Comic Sans MS, cursive, sans-serif" font-size="11" text-anchor="start">• Components: cuda-core, cuda-bindings,</text><text x="501" y="277" fill="#333" font-family="Comic Sans MS, cursive, sans-serif" font-size="11" text-anchor="start">cuda-pathfinder, cuda-python</text><path fill="none" stroke="#FF9800" stroke-linejoin="round" stroke-width="2.5" marker-end="url(#orangearrow)" d="M451,292 Q449,305 450,312 M446,308 L450,314 L455,309"/><text x="480" y="305" fill="#FF9800" font-family="Comic Sans MS, cursive, sans-serif" font-size="12">wheel upload</text><path fill="#fff3e0" stroke="#FF9800" stroke-linejoin="round" stroke-width="2.5" d="M52,322 Q53,319 851,321 Q854,324 853,447 Q851,452 50,449 Q47,446 52,322 Z"/><text x="451" y="342" fill="#F57C00" font-family="Comic Sans MS, cursive, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">ARTIFACT STORAGE</text><path fill="#fff" stroke="#FF9800" stroke-linejoin="round" stroke-width="2" d="M122,357 Q123,354 398,356 Q402,358 401,433 Q399,437 121,436 Q118,433 122,357 Z"/><text x="261" y="377" fill="#333" font-family="Comic Sans MS, cursive, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">GitHub Artifacts</text><text x="259" y="392" fill="#666" font-family="Comic Sans MS, cursive, sans-serif" font-size="10" text-anchor="middle">• Wheel files (.whl)</text><text x="261" y="404" fill="#666" font-family="Comic Sans MS, cursive, sans-serif" font-size="10" text-anchor="middle">• Test artifacts</text><text x="262" y="416" fill="#666" font-family="Comic Sans MS, cursive, sans-serif" font-size="10" text-anchor="middle">• Documentation</text><text x="260" y="430" fill="#666" font-family="Comic Sans MS, cursive, sans-serif" font-size="9" text-anchor="middle">(30-day retention)</text><path fill="#fff" stroke="#FF9800" stroke-linejoin="round" stroke-width="2" d="M502,358 Q503,355 778,357 Q782,359 781,434 Q779,438 501,437 Q498,434 502,358 Z"/><text x="641" y="378" fill="#333" font-family="Comic Sans MS, cursive, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">GitHub Cache</text><text x="639" y="402" fill="#666" font-family="Comic Sans MS, cursive, sans-serif" font-size="10" text-anchor="middle">• Mini CTK cache</text><path fill="none" stroke="#FF9800" stroke-linejoin="round" stroke-width="2.5" marker-end="url(#orangearrow)" d="M449,452 Q451,465 452,472 M447,468 L452,474 L457,469"/><path fill="none" stroke="#FF9800" stroke-dasharray="5 3" stroke-linejoin="round" stroke-width="2.5" marker-end="url(#orangearrow)" d="M641,358 Q642,340 630,320 Q625,310 580,305 Q560,300 540,298"/><text x="660" y="310" fill="#FF9800" font-family="Comic Sans MS, cursive, sans-serif" font-size="12">mini CTK reuse</text><path fill="none" stroke="#FF9800" stroke-dasharray="5 3" stroke-linejoin="round" stroke-width="2.5" marker-end="url(#orangearrow)" d="M260,437 Q258,520 260,580 Q262,615 300,625 Q310,630 350,642"/><text x="220" y="640" fill="#FF9800" font-family="Comic Sans MS, cursive, sans-serif" font-size="12">wheel fetch</text><path fill="none" stroke="#FF9800" stroke-dasharray="5 3" stroke-linejoin="round" stroke-width="2.5" marker-end="url(#orangearrow)" d="M641,434 Q642,434 630,435 Q620,445 580,450 Q540,465 520,472"/><text x="660" y="470" fill="#FF9800" font-family="Comic Sans MS, cursive, sans-serif" font-size="12">mini CTK reuse</text><path fill="none" stroke="#FF9800" stroke-dasharray="5 3" stroke-linejoin="round" stroke-width="2.5" marker-end="url(#orangearrow)" d="M261,434 Q262,435 280,437 Q300,445 340,450 Q380,465 400,473"/><text x="180" y="470" fill="#FF9800" font-family="Comic Sans MS, cursive, sans-serif" font-size="12">wheel fetch</text><path fill="#e8f5e8" stroke="#4CAF50" stroke-linejoin="round" stroke-width="2.5" d="M51,482 Q52,479 853,481 Q856,484 854,617 Q852,622 49,619 Q46,616 51,482 Z"/><text x="451" y="502" fill="#388E3C" font-family="Comic Sans MS, cursive, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">TEST STAGE</text><path fill="#fff" stroke="#4CAF50" stroke-linejoin="round" stroke-width="2" d="M82,522 Q83,519 278,521 Q282,523 281,563 Q279,567 81,566 Q78,563 82,522 Z"/><text x="181" y="542" fill="#333" font-family="Comic Sans MS, cursive, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">linux-64</text><text x="179" y="557" fill="#666" font-family="Comic Sans MS, cursive, sans-serif" font-size="11" text-anchor="middle">Self-hosted</text><path fill="#fff" stroke="#4CAF50" stroke-linejoin="round" stroke-width="2" d="M351,523 Q352,520 548,522 Q552,524 551,564 Q549,568 350,567 Q347,564 351,523 Z"/><text x="451" y="543" fill="#333" font-family="Comic Sans MS, cursive, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">linux-aarch64</text><text x="449" y="558" fill="#666" font-family="Comic Sans MS, cursive, sans-serif" font-size="11" text-anchor="middle">Self-hosted</text><path fill="#fff" stroke="#4CAF50" stroke-linejoin="round" stroke-width="2" d="M621,524 Q622,521 818,523 Q822,525 821,565 Q819,569 620,568 Q617,565 621,524 Z"/><text x="721" y="544" fill="#333" font-family="Comic Sans MS, cursive, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">win-64</text><text x="719" y="559" fill="#666" font-family="Comic Sans MS, cursive, sans-serif" font-size="11" text-anchor="middle">GitHub-hosted</text><text x="102" y="582" fill="#333" font-family="Comic Sans MS, cursive, sans-serif" font-size="11" text-anchor="start">• Download wheels from artifacts</text><text x="101" y="597" fill="#333" font-family="Comic Sans MS, cursive, sans-serif" font-size="11" text-anchor="start">• Test against multiple CUDA runtime versions</text><text x="102" y="612" fill="#333" font-family="Comic Sans MS, cursive, sans-serif" font-size="11" text-anchor="start">• Run Python unit tests, Cython tests, examples</text><text x="501" y="582" fill="#E91E63" font-family="Comic Sans MS, cursive, sans-serif" font-size="11" font-weight="bold" text-anchor="start">Artifact Flows:</text><text x="502" y="597" fill="#E91E63" font-family="Comic Sans MS, cursive, sans-serif" font-size="11" font-weight="bold" text-anchor="start">• cuda-pathfinder: main → backport</text><text x="501" y="612" fill="#E91E63" font-family="Comic Sans MS, cursive, sans-serif" font-size="11" font-weight="bold" text-anchor="start">• cuda-bindings: backport → main</text><path fill="none" stroke="#333" stroke-linejoin="round" stroke-width="2.5" d="M451,622 Q449,635 450,642 M446,638 L450,644 L455,639"/><path fill="#ffebee" stroke="#f44336" stroke-linejoin="round" stroke-width="2.5" d="M52,652 Q53,649 851,651 Q854,654 853,767 Q851,772 50,769 Q47,766 52,652 Z"/><text x="451" y="672" fill="#D32F2F" font-family="Comic Sans MS, cursive, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">RELEASE PIPELINE</text><path fill="#fff" stroke="#f44336" stroke-linejoin="round" stroke-width="2" d="M122,687 Q123,684 298,686 Q302,688 301,743 Q299,747 121,746 Q118,743 122,687 Z"/><text x="211" y="707" fill="#333" font-family="Comic Sans MS, cursive, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Validation</text><text x="209" y="722" fill="#666" font-family="Comic Sans MS, cursive, sans-serif" font-size="9" text-anchor="middle">• Artifact integrity</text><text x="211" y="734" fill="#666" font-family="Comic Sans MS, cursive, sans-serif" font-size="9" text-anchor="middle">• Git tag verification</text><path fill="none" stroke="#333" stroke-linejoin="round" stroke-width="2.5" d="M302,717 Q325,715 348,717 M344,713 L348,717 L345,721"/><path fill="#fff" stroke="#f44336" stroke-linejoin="round" stroke-width="2" d="M362,688 Q363,685 538,687 Q542,689 541,744 Q539,748 361,747 Q358,744 362,688 Z"/><text x="451" y="708" fill="#333" font-family="Comic Sans MS, cursive, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Publishing</text><text x="449" y="723" fill="#666" font-family="Comic Sans MS, cursive, sans-serif" font-size="9" text-anchor="middle">• PyPI/TestPyPI</text><text x="451" y="735" fill="#666" font-family="Comic Sans MS, cursive, sans-serif" font-size="9" text-anchor="middle">• Component or all releases</text><path fill="none" stroke="#333" stroke-linejoin="round" stroke-width="2.5" d="M542,718 Q565,716 588,718 M584,714 L588,718 L585,722"/><path fill="#fff" stroke="#f44336" stroke-linejoin="round" stroke-width="2" d="M602,689 Q603,686 778,688 Q782,690 781,745 Q779,749 601,748 Q598,745 602,689 Z"/><text x="691" y="709" fill="#333" font-family="Comic Sans MS, cursive, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Documentation</text><text x="689" y="724" fill="#666" font-family="Comic Sans MS, cursive, sans-serif" font-size="9" text-anchor="middle">• GitHub Pages</text><text x="691" y="736" fill="#666" font-family="Comic Sans MS, cursive, sans-serif" font-size="9" text-anchor="middle">• Release notes</text><text x="102" y="762" fill="#333" font-family="Comic Sans MS, cursive, sans-serif" font-size="11" text-anchor="start">• Manual workflow dispatch with run ID</text><text x="501" y="762" fill="#333" font-family="Comic Sans MS, cursive, sans-serif" font-size="11" text-anchor="start">• Supports individual component or full releases</text></svg>